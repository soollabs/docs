name: Deploy Documentation Worker

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Rendered static-site artifact; leave empty for commands without assets
        required: false
        default: ""
        type: string
      command:
        description: Wrangler command to execute
        required: true
        type: string
      environment-name:
        description: GitHub environment that protects this deployment
        required: true
        type: string
      job-name:
        description: Human-readable deployment operation shown by GitHub Actions
        required: true
        type: string
      preview-name:
        description: Preview Worker name; leave empty for a production deployment
        required: false
        default: ""
        type: string
      site-host:
        description: Public hostname for this documentation site
        required: true
        type: string
      wrangler-config:
        description: Site-specific Wrangler configuration path
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.preview-name != '' && format('https://{0}.{1}', inputs.preview-name, inputs.site-host) || format('https://{0}', inputs.site-host) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: public

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          wranglerVersion: "4.149.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ inputs.command }} --config=${{ inputs.wrangler-config }}
